    result: >
      config.CreditApiSettings(CREDIT_API_URL/KEY/TIMEOUT,不缓存,env改即生效) +
      ops/credit_api.py(httpx 工具,未配置→None,配置→调用+结果过 credit-check 契约校验,任何失败优雅降级→None) +
      contracts/tools/credit-check.schema.json(结果强契约) + .env.example(占位+接入说明) +
      cli credit-check(可直接运行的调用点) + 5 测试(未配置/成功/坏响应/HTTP错/available)。272 passed。
      → 用户后续只需填 CREDIT_API_URL+CREDIT_API_KEY 进 env，credit-check 即用，无需改代码。
    followup: >
      «自动在评标内联流程中调用»未接：投标人企业名在命令执行中途才抽出(鸡生蛋)，需两遍流程或
      把工具暴露成 Claude 可调 skill。当前 CLI 是直接可用面；流程内自动注入留 backlog。
    spec: >
      用户(2026-06-20)：目前没有企业信用/发票查验接口，后面去争取。现在审核遇 requires_external_data
      直接跳过→人工审核(manual_review)。但代码全部做好、环境变量也配好——后面只要复制 api url+key
      进 env 就能直接用，无需再改代码。
    files:
      - server/platform/config.py            # 加 CREDIT_API_URL/CREDIT_API_KEY env + credit_api_configured 标志
      - server/common/external_tools.py      # 新：企业信用查询工具(httpx)；未配置→None(跳过)；配置→调用+结果过 schema
      - .claude/contracts/tools/credit-check.schema.json  # 新：外部 API 结果 I/O 契约
      - .env.example                          # 新：占位 CREDIT_API_URL= / CREDIT_API_KEY=
      - tests/test_external_tools.py          # 已配置(mock 成功)/未配置→跳过/坏响应→拒
    accept: >
      代码+env 全做好；未配置(无 URL/KEY)→工具返 None→评分项保持 manual_review(人工)；
      配置后(填 URL+KEY)→自动调用 + 结果先过 schema 校验再进上下文(round4 F1「结果先过代码校验」)。
    depends_on: [G1]

