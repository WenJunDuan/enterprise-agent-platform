sprint: 2026-06-20-agent-capability-redesign
title: Agent 五能力重构 — 五诉求收敛为两脊椎（验证闸 + 记忆轴）
path: System
owner: claude-code
design: design.md
roadmap: n/a                                  # 跨切面架构，非单一 roadmap item
status: planned                               # 落档先于实现，尚未动代码

decisions:
  - "五诉求（拆解/多工具/记忆/幻觉抑制/反馈修正）收敛为两脊椎：四项共用『类型化契约+过闸验证』，记忆独立"
  - "验证闸 = round4 F1 的修复；既关幻觉，又是反馈修正的便宜层；脊椎一先于脊椎二"
  - "案例记忆从属制度记忆；召回只当建议、判决前按当前规则复检；带衰减+规则版本绑定"
  - "不重开全量二次复核（ROI 负）；不引入向量库（案例量级小，结构化 key 够用）"
  - "删 legal/HR 死域（F8）先于 G2/G3，避免为死代码做抽象"

tasks:
  - id: G1
    title: 验证闸最便宜三件（schema 校验 + 引用解析器 + 算术重算）
    status: in_progress      # G1a schema 校验 done；G1b-lite policy_refs 非空 done；G1b-full/G1c 延后
    files:
      - server/common/contract.py            # apply_schema_semantics 内加 jsonschema.validate [done]
      - server/common/output_contracts.py    # approved/rejected 须引 ≥1 policy_ref [done]
      - tests/test_contract_registry.py       # 验证闸用例(缺字段/多余/类型/枚举/空refs → 拒) [done]
      - tests/test_core_pure.py               # _ok helper 补 policy_refs [done]
    accept: "缺 policy_refs/evidence_chain/risk_score 或引用不解析 → JSONContractError 或 manual_review；既有重试环接住"
    result_g1a: "jsonschema.validate 在 enrich 前对所有模型输出跑(text/structured 两路)；缺 required/多余字段/类型错/枚举错全拒；265 passed"
    result_g1b: "approved/rejected 空 policy_refs → 拒(无依据判决)。直击 round4「approved 无 refs 也通过」"
    g1_full_done: >
      G1b-full + G1c 已补全(2026-06-20，验证非判断)：
      G1b-full(output_contracts._load_known_rule_ids 扫 knowledge/*/*.rules.json，policy_refs 须 ⊆ 真实 rule_id)
      按 G3 同款 env 门控 RULE_REF_CHECK(默认关,避免 gitignored knowledge/ 破坏测试;部署侧规则稳定后开启)；
      G1c(_verify_scoring_consistency: extracted_data.scoring 每项 0≤score≤max，null 分跳过)未门控(安全不变式)。
      19 contract_registry 用例(schema/policy/ref/scoring)；279 全量绿。
    g1_backlog: >
      仍剩(诚实记 backlog,均需 Python 拿到「真实输入/确定性数」,与「Python 不判断」架构有张力)：
      ① evidence_chain 每条 source 解析到真实输入文件/字段(design §脊椎一第2件与 policy_refs 并列；
         现仅 jsonschema 查 source 非空,未解析真伪)——需 Python 知道本案输入文件清单,留 backlog；
      ② 算术「重算」(金额/限额/日期由 OCR 确定性数→Python 重比较)——需 OCR 确定性数+域比较逻辑,留 backlog。
      已落地的是「验证轻量层」(schema 形+policy 非空+ref⊆真实rule_id(门控)+score≤max),非完整深度解析。
    note: "杠杆最高的一刀；同时关闭 round4 F1（BLOCKER）的核心"

