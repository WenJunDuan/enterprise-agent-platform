      G1c(_verify_scoring_consistency: extracted_data.scoring 每项 0≤score≤max，null 分跳过)未门控(安全不变式)。
      19 contract_registry 用例(schema/policy/ref/scoring)；279 全量绿。仍剩：算术「重算」(需 OCR 确定性数,架构更重)留 backlog
