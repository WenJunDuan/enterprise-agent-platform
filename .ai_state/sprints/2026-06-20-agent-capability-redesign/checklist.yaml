    spec: >
      用户(2026-06-20)：目前没有企业信用/发票查验接口，后面去争取。现在审核遇 requires_external_data
      直接跳过→人工审核(manual_review)。但代码全部做好、环境变量也配好——后面只要复制 api url+key
      进 env 就能直接用，无需再改代码。
    files:
