    title: F6 retry/delete 原子化（消除并发双执行/双成本）
    status: done                  # try_transition + delete_if_idle 原子 CAS;294 green(含 8-线程单赢家测试)/ruff
    files:
      - server/stores/audit_task_store.py         # 新 try_transition(原子 CAS 状态转移)
