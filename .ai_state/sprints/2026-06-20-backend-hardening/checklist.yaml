      - knowledge/tender/statute-regulation.rules.json   # 部署侧：同上
      - tests/test_contract_registry.py           # 默认开行为 + 任何假 ref fixture 修真
    accept: >
      RULE_REF_CHECK 不设时即生效(假规则号 approved 被拒，空集跳过)；validate-assets 对 tender 转 ok；
      全量绿 + ruff clean。注入规则集==knowledge 规则集 已确认。
