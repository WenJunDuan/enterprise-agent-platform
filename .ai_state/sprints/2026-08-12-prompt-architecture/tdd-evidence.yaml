deviations:
  - id: "D1"
    status: "已回 design 结案（2026-08-13），不再是偏离"
    what: "「执行方式+S0」实测 746B，曾超 design 原上界 700B 共 46B"
    why: |
      根因是 design 预算表自身的契约内部矛盾：该行 700B 由界前原文 L20-22(305B)+L24-26(233B)=538B
      加余量得出，**未给 design 自己强制的 fail-visible 一行留预算**（KD1「Read 失败语义…此语义写进
      命令骨架一行」在预算表里没有对应行）。该行压到 208B 已是保住两项强制语义（声明措辞 + 整单降
      manual_review/rule_gap）的下限，再压即删语义。
      按 review pass1 F1 / evaluator 最小解锁清单第 1 条处置：**回 design 修订判据**（预算表该行
      700→750、合计 13,700→13,750，修订块写明理由与出处），evidence/section_budget.py 的 cap 同步
      并旁注出处。复跑后逐节 8/8 全绿、脚本 EXIT=0。整文件上界 15,000 与合计口径未被放宽到实测值
      以上（实测 12,442B，余量 1,308B）。
  - id: "D2"
    what: "L50-55（通则层法规 Read + 护栏）下沉 s1-criteria-structuring.md，未留在骨架"
    why: "骨架 S1 节上界 900B 装不下这 1,054B。该 reference 由 S1 开头确定性 Read，其中的 Read 动作照常执行；骨架另留一句 rule_gap 硬门保可见性。已记入 design 附录 A。"
  - id: "D3"
    what: "L104-105（决断总纲）留在 S4 原位，未按预算表挪到 S3 节"
    why: "两节实测均低于各自上界（S3 2,451≤2,800 / S4 1,672≤1,800），保持原位少一次段落搬迁、降低语义漂移面。已记入 design 附录 A。"
  - id: "D4"
    what: "KD4 未删 common/ 与 system/ 目录，只删两个分组级 SKILL.md 空壳"
    why: "盘点证伪 design「两个目录是空壳」的前提：目录下有 7 个真实子 skill，其中 5 个被 4 个 agent 的 frontmatter 声明。design KD4 明写「若盘点发现实际消费者…以盘点结果为准，二选一」，故按盘点执行。删目录会误伤生产能力。"
  - id: "D5"
    what: "tests/test_tender_pending_reason.py 有 1 处非零修改（fixture 读取路径），11 条断言与用例数未变"
    why: |
      test_tender_evaluate_prompt_declares_every_pending_reason 断言「六个取值出现在 prompt 里」，
      而枚举逐值语义已随 S3 细则下沉到 s3-scoring-modes.md（该文件由 S3 开头确定性 Read，运行时
      模型必然看到——正是 design F3 要求的"枚举在 S3 运行时上下文必须可达"）。故把 fixture 读取范围
      从单文件扩为「命令骨架 + s3-scoring-modes.md」两份，断言、PENDING_REASONS 常量与其余 10 条用例
      逐字未动。design 影响范围节明确许可：「如枚举读取路径需要 fixture 调整，仅限测试装置不动断言」。
  - id: "D6"
    what: "T0 eval 收益基线（AC7）未跑 → defer"
    why: "需可调模型的部署机窗口，worktree 内无该环境；design 明写 AC7 可选、不阻塞。与 D7 的 runtime-verify 不是同一件事。"
  - id: "D7"
    what: "runtime-verify 未执行 → 显式 deferred（review pass1 F2）"
    why: "见下方 runtime-verify-defer 记录与 evidence/runtime-verify-defer.md；窗口不可达，四项待验项已逐条写死。"
