    title: tender-evaluate.md S1 重写(读招标文件第三章→criteria)+ 翻护栏
    status: planned
    files:
      - .claude/commands/tender-evaluate.md
    accept: >
      S1 改为:Read 招标文件第三章《评标办法》→ 结构化为 criteria(评分项+满分+评分规则+出处+不可判定标签)→
      写 extracted_data.criteria;删"读项目层 {编号}.rules.json / 缺失 rule_gap / 不要读招标文件 PDF";
      新护栏"直读招标文件第三章=权威,没写的不臆测补"。
