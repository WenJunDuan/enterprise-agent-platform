    title: 清 .claude — 去 tender 项目层概念 + statute 死引用
    status: planned
    files:
      - .claude/CLAUDE.md                           # tender 段:删项目层预建/init-rules,改通则层+招标文件直读
      - .claude/agents/tender/evaluator.md          # 清 statute.rules.json / tender_statute_*(已不存在)
      - .claude/agents/tender/extractor.md          # 同上
      - .claude/skills/tender-eval/SKILL.md         # 清 statute;两层改"通则(法规)+会话标准(招标文件)"
      - .claude/skills/system/rule-init/SKILL.md    # 去 tender 项目层(招标编号→{编号}.rules.json)那条
    accept: "grep statute 在 .claude 清零;CLAUDE.md/SKILL/agent 口径一致指向新流程;不残留'项目层预建'"
    depends_on: [T2]

  - id: T5
    title: 测试 + 验收
    status: planned
    files:
      - tests/  # tender 命令/CLI 产出 criteria + 按 criteria 评分;缺招标文件 manual_review;视现有 test_cli_tender_evaluate 调整
    accept: "uv run pytest -q 全绿 + ruff clean + validate-assets ok;验收标准(design §验收)逐条过;System 路径交叉审查 PASS"
    depends_on: [T1, T2, T3, T4]

