      真实 rule_id(如 tender_evalmethod_003 授权项目自定权重),criteria 命中/出处写 evidence_chain;
      不可判定项 score:null 不判 0。缺招标文件→manual_review(rule_gap)。
    depends_on: [T1, T2]

