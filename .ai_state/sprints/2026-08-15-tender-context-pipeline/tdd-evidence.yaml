      **旧常量 _SCAFFOLD_RESERVE_TOKENS=30,000 被本实测证伪**——仅提示词资产就装不下。
      新值 90,000 含 CLI 侧 system prompt/工具定义余量；脚本对「预留 < 实测下界」fail-closed。
