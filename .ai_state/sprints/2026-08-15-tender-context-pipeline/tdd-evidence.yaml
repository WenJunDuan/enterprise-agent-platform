measurements:
  - name: "AC0b 双通道召回率（等效构造底稿，本机无部署机真实底稿）"
    command: "uv run python scripts/measure_tender_recall.py /tmp/fake_bid_draft.txt"
    result: >-
      28,210 字 / 67 页底稿，走生产链路 build_chunks 得 12 chunk
      （min 1,382 / 中位 2,569 / max 3,830，均 ≤ MAX_CHUNK_CHARS=4,000）。
      双通道召回 20/20 = 100% / 1.2ms；对照组（仅 FTS5 = 改造前）14/20 = 70%，
      漏检恰好是 报价 业绩 工期 资质 质量 工艺 六个 2 字词。
      rag_chunks 与 rag_chunk_scan chunk_id 一致 12/12。门槛 88% → PASS。
    caveat: >-
      本机无部署机真实底稿，语料为等效构造（章节结构与中文措辞贴近真实标书，
      查询词表取自 S0-B 用过的真实 criteria 项名）。对照组数字证明该度量能抓住
      它要防的失败，不是随便怎么实现都 100%。

  - name: "脚手架 token 实测（AC6 标定方法可复跑）"
    command: "uv run python scripts/measure_tender_scaffold.py"
    result: >-
      57,988 字（命令 20,260 + tender-eval skill references 21,331 + 两份 schema 16,398）。
      **旧常量 _SCAFFOLD_RESERVE_TOKENS=30,000 被本实测证伪**——仅提示词资产就装不下。
      新值 90,000 含 CLI 侧 system prompt/工具定义余量；脚本对「预留 < 实测下界」fail-closed。
