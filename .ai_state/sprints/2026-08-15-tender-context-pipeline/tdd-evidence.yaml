measurements:
  - name: "AC0b 双通道召回率"
    status: "BLOCKED —— 不计 PASS（返工 F3 改判）"
    command: "uv run python scripts/measure_tender_recall.py   # 无底稿时输出 AC0b: BLOCKED, 退出码 2"
    result: >-
      冒烟自检（构造语料）：7 chunk，双通道 20/20 = 100% / 0.7ms，对照组（仅 FTS5 =
      改造前）14/20 = 70%，漏检恰好是 报价 业绩 工期 资质 质量 工艺 六个 2 字词；
      rag_chunks 与 rag_chunk_scan chunk_id 一致。**这组数字只证明双通道接线与两表同源，
      不构成召回达标证据。**
    why_blocked: >-
      构造语料把 20 个查询词逐字埋进正文，≥3 字通道 verbatim 必中；ground truth 用子串
      匹配，又把"措辞不同"这类漏检排除出分母。该度量**结构上抓不住 S0-B 真实数据暴露的
      那类失败**（真实项「价格-最后报价」verbatim 缺失 → 裸用召回 38%）。判据一旦能由构造
      保证，它就不再是判据。上一轮据此计 PASS，是 pass1 F3 的成因。
    unblock: >-
      拿部署机真实投标底稿（S0-B 用过的那份，163,170 字）跑
      `uv run python scripts/measure_tender_recall.py <真实底稿.txt>`，命中率 ≥88%
      （S0-B 实测基线）方可计 PASS；跌破则按 design「已调研方案」表升级 map-reduce。
      复测前置条件已就绪：KD2 多词拆 OR 已于 130ba67 补上（此前未实现，是复测最大风险点）。
    enforcement: >-
      脚本已改为无真实底稿时只输出 `AC0b: BLOCKED` 并返回 2，结构上不可能自证通过；
      tests/test_tender_recall_measurement.py 锁住这条不变量。

