      github.com/baidu/Unlimited-OCR）=整本长文档一次性解析层（标书全本→章节树，
      直接服务 D6 结构化+D8 底稿瘦身，SGLang/transformers 部署）。
      路由形态=Claude 式分级升级（escalation）：便宜先行→_page_confidence/file_clarity
      低置信页升级（extract_pdf_subset 只重跑差页，期望成本最小化，非单模型最优）；
      印章页→seal 产线编排进主流程；手写/疑难兜底→内网多模态（qwen3.6-27b）。
      实现锚点：engine.recognize() 的 env if/elif 换 EngineRegistry+能力画像+路由策略；
      cache._engine_fingerprint 升 per-engine 进 cache key；classify(L1 文件类型路由)不动。
      模型池经统一 litellm 网关注册，兼容内网自托管与云网关双部署形态。
      印章/手写 POC（memory 挂账待办）在此落地，三模型能力画像以 POC 实测为准（铁律[出处优先]，
      不凭记忆填基准）。捎带：ocr/runner.py 迁离 core 门面私有名 import（_extract_json_object）。
      改动须过 D1 golden case 回归。
