# =============================================================================
# 出差报销审计规则 - 默认基线 v2.0
# =============================================================================
# 参考:
#   - 财政部《中央和国家机关差旅费管理办法》(财行〔2013〕531号)
#   - 《关于调整中央和国家机关差旅住宿费标准等有关问题的通知》
#   - 国内大中型企业差旅报销常见实践
#
# ⚠️ 占位符基线 — 企业应替换为自身制度
# =============================================================================

schema_version: "2.0"
last_updated: "2025-01-01"
currency: "CNY"

# =============================================================================
# 职级体系
# =============================================================================
rank_tiers:
  - tier_id: "senior"
    label: "高级管理层"
    description: "VP及以上、总监级"
  - tier_id: "middle"
    label: "中层管理"
    description: "经理级、高级专员"
  - tier_id: "staff"
    label: "一般员工"
    description: "专员、助理及以下"

default_tier: "staff"

# =============================================================================
# 城市分级
# =============================================================================
city_tiers:
  tier_1:
    label: "一线城市"
    cities: ["北京", "上海", "广州", "深圳"]
  tier_2:
    label: "二线/省会城市"
    cities: ["杭州", "南京", "成都", "武汉", "重庆", "西安", "苏州", "天津",
             "长沙", "郑州", "青岛", "大连", "宁波", "厦门", "福州", "合肥",
             "济南", "沈阳", "昆明", "哈尔滨", "长春", "南昌", "贵阳",
             "石家庄", "太原", "南宁", "兰州", "乌鲁木齐", "呼和浩特",
             "海口", "银川", "西宁", "拉萨"]
  tier_3:
    label: "其他城市"
    cities: []

# =============================================================================
# 住宿标准
# =============================================================================
accommodation:
  daily_limit:
    senior:  { tier_1: 800, tier_2: 600, tier_3: 450 }
    middle:  { tier_1: 600, tier_2: 450, tier_3: 350 }
    staff:   { tier_1: 500, tier_2: 350, tier_3: 250 }
  rules:
    - id: "ACC-001"
      description: "住宿费不得超过对应职级和城市等级的每日上限"
      severity: "HIGH"
    - id: "ACC-002"
      description: "入住日期必须在出差日期范围内"
      severity: "HIGH"
    - id: "ACC-003"
      description: "酒店所在城市应与出差目的地一致"
      severity: "HIGH"
    - id: "ACC-004"
      description: "住宿天数不应超过实际出差天数减1（当天往返除外）"
      severity: "MEDIUM"
    - id: "ACC-005"
      description: "需提供酒店发票或水单（非预订确认）"
      severity: "HIGH"

# =============================================================================
# 交通标准
# =============================================================================
transportation:
  flight:
    class_limit:
      senior: "business"
      middle: "economy"
      staff: "economy"
    # 舱位等级排序（越高越贵），用于比较是否超标
    class_hierarchy: ["economy", "premium_economy", "business", "first"]
    rules:
      - id: "TRA-F01"
        description: "机票舱位不得超过职级允许的最高舱位"
        severity: "HIGH"
      - id: "TRA-F02"
        description: "航班日期应与行程单出发/返回日期一致"
        severity: "HIGH"
      - id: "TRA-F03"
        description: "需提供电子客票行程单"
        severity: "HIGH"

  train:
    class_limit:
      senior: "business"
      middle: "first"
      staff: "second"
    class_hierarchy: ["second", "first", "business"]
    rules:
      - id: "TRA-T01"
        description: "火车票座次不得超过职级允许的最高座次"
        severity: "HIGH"
      - id: "TRA-T02"
        description: "乘车日期应与行程计划一致"
        severity: "MEDIUM"

  taxi:
    daily_limit:
      senior: 300
      middle: 200
      staff: 150
    rules:
      - id: "TRA-X01"
        description: "单日出租车/网约车费用累计不得超过上限"
        severity: "MEDIUM"
      - id: "TRA-X02"
        description: "需提供出租车发票或网约车电子行程单"
        severity: "MEDIUM"
      - id: "TRA-X03"
        description: "打车起止地点应与工作行程相关"
        severity: "LOW"

  local_transit:
    daily_limit: 80
    rules:
      - id: "TRA-L01"
        description: "市内公共交通按实报销，每日上限80元"
        severity: "LOW"

# =============================================================================
# 餐饮标准
# =============================================================================
meals:
  mode: "per_diem"  # per_diem | actual | hybrid

  per_diem:
    daily_amount:
      tier_1: 120
      tier_2: 100
      tier_3: 80
    half_day_ratio: 0.5  # 出发日/返回日按半天计
    rules:
      - id: "MEA-001"
        description: "伙食补助按出差天数计算，出发日和返回日各按半天"
        severity: "MEDIUM"
      - id: "MEA-002"
        description: "接待方已安排用餐的，对应餐次不得再领取伙食补助"
        severity: "HIGH"

  business_meal:
    per_person_limit: 200
    rules:
      - id: "MEA-B01"
        description: "商务用餐需注明事由及陪餐人员"
        severity: "MEDIUM"
      - id: "MEA-B02"
        description: "人均消费不得超过上限"
        severity: "HIGH"
      - id: "MEA-B03"
        description: "需提供餐饮发票"
        severity: "HIGH"

# =============================================================================
# 通讯费
# =============================================================================
communication:
  daily_limit: 50
  requires_invoice: false  # 通讯补助通常不需要发票
  rules:
    - id: "COM-001"
      description: "出差期间通讯费按日补助，无需发票"
      severity: "LOW"

# =============================================================================
# 其他费用
# =============================================================================
miscellaneous:
  categories:
    - name: "会议费"
      requires_invoice: true
      requires_approval: true
      limit: null
    - name: "资料/打印费"
      requires_invoice: true
      requires_approval: false
      limit: 200
    - name: "行李托运"
      requires_invoice: true
      requires_approval: false
      limit: 200
  rules:
    - id: "MIS-001"
      description: "其他费用需事先获得审批或在合理范围内"
      severity: "MEDIUM"
    - id: "MIS-002"
      description: "所有据实报销费用必须提供发票"
      severity: "HIGH"

# =============================================================================
# 通用规则
# =============================================================================
general:
  # 公司全称（用于发票抬头校验）
  # ⚠️ 占位符 — 企业必须替换
  company_name: "占位符公司名称有限公司"
  company_name_aliases: []  # 公司简称或曾用名

  reimbursement_deadline_days: 30  # 出差结束后N天内报销

  approval_thresholds:
    - amount: 5000
      approver: "部门负责人"
    - amount: 20000
      approver: "分管领导"
    - amount: 50000
      approver: "总经理"

  rules:
    - id: "GEN-001"
      description: "报销金额合计应与报销单填写金额一致"
      severity: "HIGH"
    - id: "GEN-002"
      description: "所有费用发生日期应在出差审批日期范围内"
      severity: "HIGH"
    - id: "GEN-003"
      description: "同一笔费用不得重复报销"
      severity: "HIGH"
    - id: "GEN-004"
      description: "发票抬头应为本公司全称"
      severity: "HIGH"
    - id: "GEN-005"
      description: "报销应在出差结束后30个自然日内提交"
      severity: "MEDIUM"
    - id: "GEN-006"
      description: "单次出差总费用达到审批阈值需对应层级审批"
      severity: "MEDIUM"
    - id: "GEN-007"
      description: "电子发票号码不得重复（防止同一张发票多次报销）"
      severity: "HIGH"
    - id: "GEN-008"
      description: "同一日不应出现多笔同类型费用（如两笔酒店费、两张同城机票）"
      severity: "HIGH"
    - id: "GEN-009"
      description: "周末及法定节假日产生的费用需额外说明"
      severity: "LOW"
    - id: "GEN-010"
      description: "交通路线应符合出发地→目的地→返回地的合理路径"
      severity: "MEDIUM"

# =============================================================================
# 审计阈值
# =============================================================================
thresholds:
  amount_tolerance_percent: 10
  date_tolerance_days: 1
  duplicate_amount_threshold: 0.01
  duplicate_date_range_days: 3

# =============================================================================
# 节假日定义（用于周末/节假日异常检查）
# =============================================================================
# 仅列出固定假日，调休和特殊年份需按实际更新
holidays:
  fixed:
    - name: "元旦"
      month: 1
      day: 1
    - name: "劳动节"
      month: 5
      day: 1
    - name: "国庆节"
      month: 10
      days: [1, 2, 3]
  # 可扩展: 春节、清明、端午、中秋等浮动假日
  # 浮动假日建议按年度更新，或从外部日历API获取
  floating: []
