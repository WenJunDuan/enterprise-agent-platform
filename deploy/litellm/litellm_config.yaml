# LiteLLM 代理配置 —— 把 Claude 系模型名映射到 Qwen，并双向翻译 tool_use。
#
# 链路：
#   claude-agent-sdk → Claude Code CLI 发出 model=claude-opus-4-8（Claude 名）
#   → LiteLLM 按下面 model_list 改名并打到真实 Qwen 模型
#   → 在 Anthropic ↔ OpenAI 协议间翻译请求/响应（含工具调用 tool_use）
#
# 为什么发 Claude 名：Claude Code 用模型 ID 的“子串”判断能力（上下文窗口/特性）。
#   claude-opus-4-8 这类名 → 走完整 opus 能力；qwen-max 这类名 → 能力降级到 ~32K。
#   所以对外保持 Claude 名，真实模型在这里映射。
#
# 起服务：
#   litellm --config litellm_config.yaml --port 4000
# 必填环境变量见同目录 .env.example。

model_list:
  # —— opus 档：审核主模型
  - model_name: claude-opus-4-8
    litellm_params:
      model: qwen3.7-max
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: sk-0b051eb212a442c4bcda04a85ad642f7

  # —— sonnet 档：子 agent / 默认 sonnet 任务 ——
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: qwen3.7-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: sk-0b051eb212a442c4bcda04a85ad642f7

  # —— haiku 档：标题生成等内部快任务 ——
  - model_name: claude-haiku-4-5
    litellm_params:
      model: qwen3.7-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: sk-0b051eb212a442c4bcda04a85ad642f7

  # —— 兜底：CLI 内部偶尔会请求未在上面显式列出的 Claude 名
  - model_name: "*"
    litellm_params:
      model: qwen3.7-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: sk-0b051eb212a442c4bcda04a85ad642f7

litellm_settings:
  drop_params: true
  num_retries: 2

general_settings:
  master_key: sk-litellm-RwySHzvatZqP3NHW1kAHocrFi8ShW4D0IBUt0PNA11t14P9S
