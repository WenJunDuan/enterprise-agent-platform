# LiteLLM-only compose. Static no-DB proxy; all LiteLLM routing/provider config lives in litellm_config.yaml.
name: litellm

services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:0609
    container_name: ea-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    expose:
      - "4000"
    ports:
      - "0.0.0.0:4000:4000"
    networks:
      enterprise-agent-net:
        aliases:
          - litellm
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:4000/health/liveliness", timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  enterprise-agent-net:
    external: true
