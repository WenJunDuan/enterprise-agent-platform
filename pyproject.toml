[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "enterprise-agent-platform"
version = "0.1.0"
description = "Enterprise agent platform scaffold powered by Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.52.0",
    "claude-agent-sdk>=0.1.78",
    "fastapi>=0.115.0",
    "python-dotenv>=1.0.1",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
agent-cli = "server.cli:app"
app-server = "server.app_server:app"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
