[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "enterprise-agent-platform"
version = "0.1.0"
description = "Enterprise agent platform scaffold powered by Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.88",
    "fastapi>=0.115.0",
    "jsonschema>=4.23.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.30",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# 文档识别(multi-ocr)用：原生直读的纯 Python 依赖（Excel/Word/文本层 PDF）。
# OCR 引擎 paddleocr[doc-parser] / paddlex 因需配 paddlepaddle-gpu(CUDA/昇腾专版)
# 单独装，见 .claude/skills/multi-ocr/references/engines.md。
ocr = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pymupdf>=1.26",
    "pypdf>=5.0",
]

[project.scripts]
app-server = "server.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
