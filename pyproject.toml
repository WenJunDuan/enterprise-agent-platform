[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "enterprise-agent-platform"
version = "0.1.0"
description = "Enterprise agent platform scaffold powered by Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.88",
    "fastapi>=0.115.0",
    "jsonschema>=4.23.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.30",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
app-server = "server.app_server:app"

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
line-length = 100
target-version = "py312"
