[project]
name = "enterprise-agent-platform"
version = "0.1.0"
description = "Enterprise agent platform workspace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.85.0",
    "certifi>=2026.0.0",
    "claude-agent-sdk>=0.1.48",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "typer>=0.24.1",
    "uvicorn>=0.42.0",
]

[project.scripts]
agent-cli = "server.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
