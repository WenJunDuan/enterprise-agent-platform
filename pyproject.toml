[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "enterprise-agent-platform"
version = "0.1.0"
description = "Enterprise agent platform scaffold powered by Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.117.0",
    "claude-agent-sdk>=0.2.88",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "jsonschema>=4.23.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.31",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# 文档识别(multi-ocr)用：原生直读的纯 Python 依赖（Excel/Word/文本层 PDF）。
# OCR 引擎 paddleocr[doc-parser] / paddlex 因需配 paddlepaddle-gpu(CUDA/昇腾专版)
# 单独装，见 .claude/skills/multi-ocr/references/engines.md。
ocr = [
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "xlrd==2.0.2",
    "pyxlsb==1.0.10",
    "python-pptx==1.0.2",
    "Pillow==12.3.0",
    "pymupdf==1.28.2",
    "pypdf==6.15.0",
    "pdfplumber==0.11.10",
    "paddlepaddle==3.2.2",
    "paddleocr[doc-parser]==3.7.0",
    "paddlex==3.7.2",
    "certifi>=2024.0",  # 线上 OCR(OCR_CLOUD=1)urllib HTTPS 验证 CA 包；缺则 macOS 等环境证书验证失败
]

[project.scripts]
app-server = "server.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
