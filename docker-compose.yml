services:
  agent-server:
    build: .
    container_name: "${APP_SERVER_NAME:-enterprise-agent-platform}"
    ports:
      - "${APP_SERVER_PORT:-8000}:${APP_SERVER_PORT:-8000}"
    env_file:
      - .env
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "uvicorn server.api:app --host 0.0.0.0 --port ${APP_SERVER_PORT:-8000}",
      ]
    volumes:
      - ./.claude:/app/.claude
      - ./knowledge:/app/knowledge
      - ./data:/app/data
      - ./logs:/app/logs
