# case-2 — 评标回归闸金标准期望（匿名 · 投标人A）
#
# 与 case-3 共用同一份招标文件，投标人不同。招标侧：信息化系统建设类公开招标，
# 综合评估法满分 100，12 个评分项 + 8 条资格审查规则，不接受联合体。
#
# **本 case 的召回对象与 case-zj-live 不同，先读这段再看下面的条目**：
# case-zj-live 的 defects 是"投标文件本身的毛病"（跨文件矛盾 / 缺件 / 依据错配）；
# case-2 / case-3 的 defects 是**"材料在第 N 页明明有、链路却没读到"**——纠偏令 v2
# 纠偏令二把「证书类三项（实力 / 业绩 / 人员）的判出率」定为这两个 case 的核心度量，
# 而"判出"在本闸里的机械形态就是：结论里有一条 finding **同时**命中该项的类别关键词
# 与该项证据的真实页锚。故每条 defect 都锚在**证据实际所在页**，不锚在"系统当前说了
# 什么"的页——锚在后者会让今天就已命中，度量归零。
#
# **页坐标系已实测核对**：本投标件每页页脚印刷页码与 PDF 物理页序号逐页相同
# （复核命令：`pdftotext -layout <投标件> -` 后按 \f 切页，逐页尾行即页码）。
# 同一命令下"文本长度 < 20 字符"的页共 59 页，与生产摄取侧记录的 `_blank_page_count=59`
# 逐数相符（`.ai_state/sprints/2026-08-15-tender-context-pipeline/plan-2026-08-18-accuracy.md`
# 第一节），两条独立路径对上，故本档页锚可信。
#
# **已知弱点（不隐藏）**：本 case 的类别关键词是"该项证据的主题词"，不是定向否定词，
# 因此一条"第85页未见任何证书"的反向结论也会被判成命中。判据仍强于现状——今天的结论
# 对这些项**一个页锚都不给**；但读数字时须知这条上界，不得把它当作"已读到证据"的证明。
#
# 匿名化是硬约束：真实语料不入库（只留 corpus.pointer.yaml 的指纹），本文件一律用
# **角色代号 + 页锚 + 类别枚举**表述，不出现任何真实机构 / 人名 / 项目编号 / 金额。
# 机械保障见 tests/test_no_real_corpus.py（扫描面已含 eval/ 与 .yaml）。
#
# 语法：由 eval/regression.py 的 YAML 子集解析器读取——支持映射、缩进序列、流式列表、
# 标量与注释；不支持锚点/别名、多行标量、流式映射（遇到即报错）。

case: case-2
project_title: 评测用例 case-2
scenario: expert_assist
note: 投标人A · 投标件 121 页，其中 59 页为纯扫描图（页文本 < 20 字符），证书 / 业绩 / 人员证据全部落在这些扫描页上

# 缺陷类别枚举 → 关键词族。**命中判定的第二把钥匙**（第一把是页锚交集，双键都中才算命中，
# 防蒙对）。关键词随标书措辞而异，故声明在 case 里而不是脚本里。
defect_classes:
  enterprise_credential_evidence: ["软件企业证书", "管理体系认证", "体系认证", "软件著作权", "著作权证书", "资质证书"]
  project_record_evidence: ["项目业绩", "业绩", "同类项目", "业绩合同"]
  staff_credential_evidence: ["项目小组成员", "团队人员", "职称", "工程师证书", "社保", "社会保障"]
  # 定向否定形态：只有真正断言"目录页码与实际对不上"的结论才配命中。
  # 裸 "目录" 刻意不入族——今天的结论满篇引"资格证明文件目录"，纳入即全员假命中。
  bid_index_page_mismatch: ["页码不符", "页码错位", "与实际不符", "实际页码", "对不上", "自相矛盾", "标注有误"]
  proposal_training_plan_evidence: ["培训计划", "培训方案", "培训课程", "培训对象"]

# 必须召回的条目。命中 = 结论中**同一条** finding 的页锚 ∩ anchors ≠ ∅ 且类别关键词命中。
#
# `attribution` 是纠偏令 v2.1 二节的缺口归因二分列（text = 列A 文本可达 / pixel = 列B
# 像素必需）。**只登记归因，不改期望值也不改命中判定**。本 case 的取值来源两种，逐条注明：
#   ① 证书类三项（A1/A2/A3）直接抄 v2.1 二节列B 末行「case-2/3 证书类三项判出率（59 页
#      纯扫描）」——即便本档 detail 记录了「页首标题可直读」，登记仍照那张表，不自行改判；
#   ② 表里没收录的条目按本档 detail 里已记录的载体形态归因（可直读文本 = 列A）。
defects:
  - id: A1
    class: enterprise_credential_evidence
    severity: P0
    role: 投标人A · 投标供应商实力（满分 10）的证书类证据
    detail: 第85-90页逐页各载一项证书且页首标题可直读——85 软件企业证书 / 86 质量管理体系认证证书 / 87 信息安全管理体系认证证书 / 88 职业健康安全管理体系认证证书 / 89 环境管理体系认证证书 / 90 软件著作权证书；证书本体为扫描图，第91页为同章无标题扫描页
    anchors: ["【第85-90页】"]
    # v2.1 二节列B 末行：case-2/3 证书类三项（实力）
    attribution: pixel
  - id: A2
    class: project_record_evidence
    severity: P0
    role: 投标人A · 项目业绩（满分 10）的合同类证据
    detail: 第92页为"项目业绩"章标题页，第93-98页为该章扫描图；评分规则按每份同类项目合同计分，故须读到合同页本身才谈得上判分
    anchors: ["【第92-98页】"]
    # v2.1 二节列B 末行：case-2/3 证书类三项（业绩）
    attribution: pixel
  - id: A3
    class: staff_credential_evidence
    severity: P0
    role: 投标人A · 团队人员（满分 5）的名单 / 职称证书 / 社保证据
    detail: 第71页"供应商项目小组成员情况表"是**可直读文本**（6 人，"学历或职称或职业资格"栏 6 人全填本科，未见高级职称），第72页为相关证书扫描页、第73页为人员社保扫描页；可直读页仍未被引用，属检索侧而非摄取侧问题
    anchors: ["【第71-73页】"]
    # v2.1 二节列B 末行：case-2/3 证书类三项（人员）。本档 detail 记录第71页可直读，
    # 与列B 归因有张力；此处照表登记不自行改判，张力留给 Step 5 结果复议
    attribution: pixel
  - id: A4
    class: bid_index_page_mismatch
    severity: P1
    role: 投标人A · 第4页投标文件目录 vs 各章实际起止页
    detail: 目录自述与实际逐条错位——商务要求响应表称 66-70 实为 69-70；技术规格偏离表称 78-83 实为 78-84；投标供应商实力称 84-90 实为 85-91；项目业绩称 91-97 实为 92-98；技术方案称 98-120 实为 99-121。招标文件明示该目录是专家评审的重要依据，错位会把评审引到错页
    anchors: ["【第4页】"]
    must_include: ["页码"]
    # v2.1 二节表未收录。第4页目录条目本身可直读（本档 detail 能逐条列出自述页码即其证据），
    # 判定只需把自述页码与各章实际起止页对齐，全程文本可达 → 列A
    attribution: text
  - id: A5
    class: proposal_training_plan_evidence
    severity: P1
    role: 投标人A · 技术实施方案-培训计划（满分 4）的方案正文
    detail: 第108页载培训对象与培训方法、第109页载培训计划本体，两页均为可直读文本（本章无图像）；该项若报"未检索到证据"，主因在检索而非摄取
    anchors: ["【第108-109页】"]
    # v2.1 二节表未收录。本档 detail 明写"两页均为可直读文本（本章无图像）" → 列A
    attribution: text

# 客观分基线：与结论 scoring[] 逐项比对，项名用 keywords 关键词族匹配。
# **这里只放真值可从素材闭合推出的项**。证书类三项（实力 / 业绩 / 人员）的真值需人工翻
# 扫描页点数（几份体系认证、几份合同在时间窗内、有无高级职称），素材不足以定值，故它们
# 走上面的 defects（考"读没读到"），不在此处编一个分值——期望值一旦落库即冻结，编错比缺项更贵。
objective_scores:
  - item_class: 质保期
    keywords: ["质保期", "质保"]
    expected: 0
    max: 5
    basis: 第116页售后服务标准两处写明免费服务期限自验收之日起 36 个月（= 招标要求的三年整体责任维护基线），第69页商务要求响应表第7项与第5页开标一览表履行期限均写"同免费质保期"；评分规则为"在三年基线上每增加 1 年加 2.5 分，最多 5 分"，本投标人未承诺任何额外年限，故本项 0 分
    # v2.1 二节表未收录（列B 只收「证书类三项」）。本项三处依据均为可直读文本，且
    # 2026-08-18 实跑在无 vision 的条件下已对该项给出 0 分 → 文本可达已被实证 → 列A
    attribution: text

# 报价勾稽：**本 case 停用**。判定式要求把复算后的合计金额字面写进 case，而真实报价金额
# 属"真实语料不得进仓库"的禁入项（与真实项目编号同级）。故 total 置 0、keywords 置空，
# 该行指标在本 case 恒为 0，读报告时按"未启用"理解，不得读成"勾稽失败"。
# 要启用须由人工决定金额脱敏形态（见交付报告的待人工确认清单）。
price_check:
  total: 0
  keywords: []
  note: 停用——真实报价金额不得入库；本 case 的报价维度改由 manual_review 分列指标观察（该项应恒为 cross_bid，属正确待人工）
