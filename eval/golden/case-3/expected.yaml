# case-3 — 评标回归闸金标准期望（匿名 · 投标人B）
#
# 与 case-2 共用同一份招标文件，投标人不同。招标侧：信息化系统建设类公开招标，
# 综合评估法满分 100，12 个评分项 + 8 条资格审查规则，不接受联合体。
#
# **本 case 的召回对象与 case-zj-live 不同，先读这段再看下面的条目**：
# case-zj-live 的 defects 是"投标文件本身的毛病"；case-2 / case-3 的 defects 是
# **"材料在第 N 页明明有、链路却没读到"**——纠偏令 v2 纠偏令二把「证书类三项
# （实力 / 业绩 / 人员）的判出率」定为这两个 case 的核心度量，"判出"在本闸里的机械形态
# 就是：结论里有一条 finding **同时**命中该项的类别关键词与该项证据的真实页锚。
# 故每条 defect 都锚在**证据实际所在页**，不锚在"系统当前说了什么"的页。
#
# **这条纪律在本 case 有一次现成的反面教材**：2026-08-18 那次实跑把第10页资格证明文件
# 目录**自述**的页码（财务 13-16、税收社保 17-18）原样抄进判定依据，而实际位置是
# 13-31 与 32-33。若把 anchors 设在 13-16 / 17-18，那次错误结论反而会被判成命中。
# 见下面的 B4 / B5。
#
# **页坐标系已实测核对**：本投标件每页页脚印刷页码与 PDF 物理页序号逐页相同
# （复核命令：`pdftotext -layout <投标件> -` 后按 \f 切页，逐页尾行即页码）。
# 同一命令下"文本长度 < 20 字符"的页共 107 页，与生产摄取侧记录的
# `_blank_page_count=107` 逐数相符
# （`.ai_state/sprints/2026-08-15-tender-context-pipeline/plan-2026-08-18-accuracy.md`
# 第一节），两条独立路径对上，故本档页锚可信。
#
# **已知弱点（不隐藏）**：类别关键词是"该项证据的主题词"而非定向否定词，因此一条
# "第59页未见任何证书"的反向结论也会被判成命中。判据仍强于现状——今天的结论对这些项
# 一个页锚都不给；但读数字时须知这条上界。
#
# 匿名化是硬约束：真实语料不入库（只留 corpus.pointer.yaml 的指纹），本文件一律用
# **角色代号 + 页锚 + 类别枚举**表述，不出现任何真实机构 / 人名 / 项目编号 / 金额。
# 机械保障见 tests/test_no_real_corpus.py（扫描面已含 eval/ 与 .yaml）。
#
# 语法：由 eval/regression.py 的 YAML 子集解析器读取——支持映射、缩进序列、流式列表、
# 标量与注释；不支持锚点/别名、多行标量、流式映射（遇到即报错）。

case: case-3
project_title: 评测用例 case-3
scenario: expert_assist
note: 投标人B · 投标件 245 页，其中 107 页为纯扫描图（页文本 < 20 字符），证书 / 业绩 / 人员证据全部落在这些扫描页上

# 缺陷类别枚举 → 关键词族。**命中判定的第二把钥匙**（第一把是页锚交集，双键都中才算命中）。
defect_classes:
  enterprise_credential_evidence: ["软件企业证书", "管理体系认证", "体系认证", "软件著作权", "著作权证书", "检测报告", "资质证书"]
  project_record_evidence: ["项目业绩", "业绩", "同类项目", "业绩合同"]
  staff_credential_evidence: ["项目小组成员", "团队人员", "职称", "工程师证书", "社保", "社会保障"]
  # 定向否定形态：只有真正断言"目录页码与实际对不上"的结论才配命中。
  # 裸 "目录" 刻意不入族——2026-08-18 实跑的结论满篇引"资格证明文件目录"，纳入即假命中。
  bid_index_page_mismatch: ["页码不符", "页码错位", "与实际不符", "实际页码", "对不上", "自相矛盾", "标注有误"]
  qualification_tax_social_evidence: ["依法缴纳税收", "社会保障资金", "税收", "社保"]
  proposal_training_plan_evidence: ["培训计划", "培训方案", "培训课程", "培训对象"]

# 必须召回的条目。命中 = 结论中**同一条** finding 的页锚 ∩ anchors ≠ ∅ 且类别关键词命中。
defects:
  - id: B1
    class: enterprise_credential_evidence
    severity: P0
    role: 投标人B · 投标供应商实力（满分 10）的证书类证据
    detail: 证据分四处且各有可直读标题页——第59页软件企业证书/高新技术企业证书（第60页扫描）、第61页产品软件著作权证书（第62-65页扫描，共 4 页）、第101页相关检测报告（第102-148页扫描）、第149页体系认证证书（第150-157页扫描）；证书本体全为扫描图
    anchors: ["【第59-65页】", "【第101页】", "【第149页】"]
  - id: B2
    class: project_record_evidence
    severity: P0
    role: 投标人B · 项目业绩（满分 10）的合同类证据
    detail: 同类项目业绩共 5 条，各有可直读标题页——第66 / 70 / 74 / 87 / 90 页，其余第67-93页为合同扫描图；评分规则按每份合同计分且限定合同签订时间窗，故必须读到合同页才谈得上判分
    anchors: ["【第66页】", "【第70页】", "【第74页】", "【第87页】", "【第90页】"]
  - id: B3
    class: staff_credential_evidence
    severity: P0
    role: 投标人B · 团队人员（满分 5）的名单 / 职称证书 / 社保证据
    detail: 第42页"供应商项目小组成员情况表"是**可直读文本**（7 人，"学历或职称或职业资格"栏 7 人全填本科，其中 1 人专业为电子信息）；第94页起为证书章（94 高级工程师证书、95 中级工程师、97 软件工程师证书，96/98 为扫描）、第99-100页为人员社保；可直读的名单页仍未被引用，属检索侧而非摄取侧问题
    anchors: ["【第42页】", "【第94-100页】"]
  - id: B4
    class: bid_index_page_mismatch
    severity: P1
    role: 投标人B · 第10页资格证明文件目录 vs 各资格材料实际起止页
    detail: 目录自述与实际逐条错位——财务状况报告称 13-16 实为 13-31；税收与社保称 17-18 实为 32-33；三份声明函称 19 实为 34；落实政采政策资格称 20 实为 35；特定资格要求称 21 实为 36。且与第2页投标文件目录（资格证明文件 11-36）自相矛盾。2026-08-18 实跑把 13-16 / 17-18 原样抄进资格审查判定依据，错误随之进入结论
    anchors: ["【第10页】"]
    must_include: ["页码"]
  - id: B5
    class: qualification_tax_social_evidence
    severity: P1
    role: 投标人B · 依法缴纳税收与社会保障资金材料的实际所在页
    detail: 第32页为该项标题页、第33页为扫描图（目录自述 17-18）；资格审查该项至今只能凭目录条目判"待人工"，从未引到 32-33。anchors 刻意不含 17-18——含则抄错页码的结论反而算命中
    anchors: ["【第32-33页】"]
  - id: B6
    class: proposal_training_plan_evidence
    severity: P1
    role: 投标人B · 技术实施方案-培训计划（满分 4）的方案正文
    detail: 培训方案自第223页起（第3页详细目录载"培训方案 223-229"），第223-229页全为可直读文本；该项若报"未检索到证据"，主因在检索而非摄取
    anchors: ["【第223-229页】"]

# 客观分基线：与结论 scoring[] 逐项比对，项名用 keywords 关键词族匹配。
# **这里只放真值可从素材闭合推出的项**。证书类三项（实力 / 业绩 / 人员）的真值需人工翻
# 扫描页点数（几份体系认证在有效期内、5 条业绩里几条落在合同时间窗内、工程师证书是否
# 属招标要求的高级职称专业），素材不足以定值，故它们走上面的 defects（考"读没读到"），
# 不在此处编一个分值——期望值一旦落库即冻结，编错比缺项更贵。
objective_scores:
  - item_class: 质保期
    keywords: ["质保期", "质保"]
    expected: 0
    max: 5
    basis: 第40页商务要求响应情况表第7项"服务期限"填"免费质保期：三年"，恰为招标要求的三年整体责任维护基线；评分规则为"在三年基线上每增加 1 年加 2.5 分，最多 5 分"，本投标人未承诺任何额外年限，故本项 0 分。2026-08-18 实跑对该项给出的 0 分与本基线一致，本条同时起"已达成能力不得回退"的作用

# 报价勾稽：**本 case 停用**。判定式要求把复算后的合计金额字面写进 case，而真实报价金额
# 属"真实语料不得进仓库"的禁入项（与真实项目编号同级）。故 total 置 0、keywords 置空，
# 该行指标在本 case 恒为 0，读报告时按"未启用"理解，不得读成"勾稽失败"。
# 要启用须由人工决定金额脱敏形态（见交付报告的待人工确认清单）。
price_check:
  total: 0
  keywords: []
  note: 停用——真实报价金额不得入库；本 case 的报价维度改由 manual_review 分列指标观察（该项应恒为 cross_bid，属正确待人工）
