# case-3 语料指针 —— 只记指纹，不记路径（纪律与量法同 case-zj-live）。
#
# 路径本身含真实机构名与真实项目名，写进仓库即违反匿名化纪律，也过不了
# tests/test_no_real_corpus.py 的形态守卫。替代定位方式：在 --corpus-root
# （默认 knowledge/external）下递归，先按 bytes 预筛，再对候选算 sha256 匹配。
#
# 语料缺席 → 脚本显式 SKIP 并打印原因（退出码 3）；bytes 撞上但 sha256 不符 → 显式
# 报错（退出码 4）。两条路都不产出假通过。
#
# 实测命令（2026-08-19，素材目录内执行）：
#   shasum -a 256 <三份 PDF>
#   stat -f "%z %N" <三份 PDF>
#   pdfinfo <PDF>            # 取 Pages
# tender 与 case-2 的 tender 是同一物理文件，指纹逐字节相同，属预期。

case: case-3
corpus_root: knowledge/external
files:
  - role: tender
    sha256: 2b04c7522b7f486a6e383426e30418ba47720809851d28e83d7c3f96f0762f13
    bytes: 500239
    pages: 52
    note: 招标文件 PDF，与 case-2 同一份；评标方法和标准在第37-39页，资格审查条款在第3页与第43-44页，页脚印刷页码与物理页序一致
  - role: bid
    sha256: 5a18b1e60dd1af42663a1f2836da1bf42d091c10ef85e9a910113e4e5abf697c
    bytes: 30399819
    pages: 245
    note: 投标人B 的投标件 PDF，无 xref 损坏；pdftotext 切页后 107 页文本 < 20 字符（纯扫描图），与生产摄取侧 _blank_page_count=107 逐数相符
